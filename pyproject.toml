[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-trading-engine"
version = "0.1.0"
description = "Dynamic portfolio allocation and execution engine."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "polars>=1.8",
  "pydantic>=2.9",
  "cvxpy>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
